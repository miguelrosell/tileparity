# Lets the library in bin/tileparity_lib be installed for notebooks and tests:
#     pip install -e .
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tileparity"
version = "0.3.0"
description = "Harmonised H&E tiling for fair comparison of image feature extractors"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["bin"]
include = ["tileparity_lib*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
