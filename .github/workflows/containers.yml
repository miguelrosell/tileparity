name: Containers
# Builds the three images from containers/*/ and publishes them to the GitHub Container
# Registry as ghcr.io/<owner>/tileparity-<name>:<pipeline version> (and :latest), then
# runs the synthetic test inside them.
#
# An image is rebuilt when its folder changes or when its tag for the current pipeline
# version does not exist yet (e.g. after the version in nextflow.config is bumped).
on:
  push:
    branches: [main]
    paths: ['containers/**', 'nextflow.config', '.github/workflows/containers.yml']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [python, uni2h, r]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Pipeline version
        id: version
        run: echo "version=$(grep -E "^\s*version\s*=" nextflow.config | head -1 | sed -E "s/.*'(.*)'.*/\1/")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide whether to build
        id: decide
        run: |
          image="ghcr.io/${{ github.repository_owner }}/tileparity-${{ matrix.image }}:${{ steps.version.outputs.version }}"
          build=true
          if [ "${{ github.event_name }}" = "push" ] && docker manifest inspect "$image" > /dev/null 2>&1; then
            before="${{ github.event.before }}"
            if git cat-file -e "${before}^{commit}" 2>/dev/null && git diff --quiet "$before" "${{ github.sha }}" -- "containers/${{ matrix.image }}"; then
              build=false
              echo "::notice::${image} exists and containers/${{ matrix.image }} is unchanged: not rebuilding"
            fi
          fi
          echo "build=${build}" >> "$GITHUB_OUTPUT"
      - name: Free disk space (the UNI2-h image is large)
        if: steps.decide.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
      - uses: docker/setup-buildx-action@v3
        if: steps.decide.outputs.build == 'true'
      - uses: docker/build-push-action@v6
        if: steps.decide.outputs.build == 'true'
        with:
          context: containers/${{ matrix.image }}
          push: true
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/tileparity-${{ matrix.image }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/tileparity-${{ matrix.image }}:latest

  test-docker:
    # End-to-end run of the synthetic test inside the published images
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space (the UNI2-h image is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: 'latest-stable'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the test profile in Docker
        run: |
          owner=${{ github.repository_owner }}
          version=$(grep -E "^\s*version\s*=" nextflow.config | head -1 | sed -E "s/.*'(.*)'.*/\1/")
          nextflow run . -profile test,docker --outdir results_test \
            --container_python ghcr.io/${owner}/tileparity-python:${version} \
            --container_uni2h ghcr.io/${owner}/tileparity-uni2h:${version} \
            --container_r ghcr.io/${owner}/tileparity-r:${version}
      - name: Show exports
        if: always()
        run: find results_test/export -type f | sort || true
      - name: Check that the images can be pulled without logging in
        if: always()
        run: |
          owner=${{ github.repository_owner }}
          version=$(grep -E "^\s*version\s*=" nextflow.config | head -1 | sed -E "s/.*'(.*)'.*/\1/")
          docker logout ghcr.io
          for name in python uni2h r; do
            if docker manifest inspect "ghcr.io/${owner}/tileparity-${name}:${version}" > /dev/null 2>&1; then
              echo "public: tileparity-${name}"
            else
              echo "::warning::ghcr.io/${owner}/tileparity-${name} is not public yet: GitHub > your profile > Packages > tileparity-${name} > Package settings > Change visibility > Public"
            fi
          done
