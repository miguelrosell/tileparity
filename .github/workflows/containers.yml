name: Containers
# Builds the three images from containers/*/ and publishes them to the GitHub Container
# Registry as ghcr.io/<owner>/tileparity-<name>:<pipeline version> (and :latest).
# After the first run, make the packages public in GitHub > Packages > Package settings.
on:
  push:
    branches: [main]
    paths: ['containers/**', '.github/workflows/containers.yml']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [python, uni2h, r]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the UNI2-h image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
      - name: Pipeline version
        id: version
        run: echo "version=$(grep -E "^\s*version\s*=" nextflow.config | head -1 | sed -E "s/.*'(.*)'.*/\1/")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: containers/${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tileparity-${{ matrix.image }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/tileparity-${{ matrix.image }}:latest

  test-docker:
    # End-to-end run of the synthetic test inside the freshly built images
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.7'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the test profile in Docker
        run: |
          owner=${{ github.repository_owner }}
          version=$(grep -E "^\s*version\s*=" nextflow.config | head -1 | sed -E "s/.*'(.*)'.*/\1/")
          nextflow run . -profile test,docker --outdir results_test \
            --container_python ghcr.io/${owner}/tileparity-python:${version} \
            --container_uni2h ghcr.io/${owner}/tileparity-uni2h:${version} \
            --container_r ghcr.io/${owner}/tileparity-r:${version}
      - name: Show exports
        if: always()
        run: find results_test/export -type f | sort
