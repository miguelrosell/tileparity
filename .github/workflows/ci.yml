name: CI
# Unit tests of the Python library and a stub run of the whole Nextflow workflow
# (checks the channel logic without containers or data).
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: containers/python/environment.yml
          cache-environment: true
      - name: Install test runner
        run: pip install pytest==9.1.1
      - name: Run unit tests
        run: python -m pytest tests/python -q

  nextflow-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.7'
      - name: Stub run of the test profile
        run: nextflow run . -profile test -stub-run --outdir results_stub

  test-conda:
    # Full run of the synthetic test with conda environments (slow; on demand only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.7'
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
      - name: Run the test profile with conda
        shell: bash -el {0}
        run: nextflow run . -profile test,conda --outdir results_test
