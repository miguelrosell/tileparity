name: CI
# Unit tests of the Python library, a stub run of the whole Nextflow workflow (channel
# logic without software or data) and, once the container images are published, an
# end-to-end run of the synthetic test in Docker.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: containers/python/environment.yml
          cache-environment: true
      - name: Install test runner
        run: pip install pytest==9.1.1
      - name: Run unit tests
        run: python -m pytest tests/python -q

  nextflow-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.7'
      - name: Stub run of the test profile
        run: nextflow run . -profile test -stub-run --outdir results_stub

  test-docker:
    # Skipped (with a notice) until the Containers workflow has published the images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check that the images of this version are published
        id: images
        run: |
          version=$(grep -E "^\s*version\s*=" nextflow.config | head -1 | sed -E "s/.*'(.*)'.*/\1/")
          available=true
          for name in python uni2h r; do
            docker manifest inspect "ghcr.io/${{ github.repository_owner }}/tileparity-${name}:${version}" > /dev/null 2>&1 || available=false
          done
          echo "available=${available}" >> "$GITHUB_OUTPUT"
          if [ "$available" != true ]; then
            echo "::notice::Images for version ${version} are not published yet (the Containers workflow builds them); skipping."
          fi
      - name: Free disk space (the UNI2-h image is large)
        if: steps.images.outputs.available == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@v4
        if: steps.images.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        if: steps.images.outputs.available == 'true'
        with:
          version: '25.04.7'
      - name: Run the test profile in Docker
        if: steps.images.outputs.available == 'true'
        run: |
          owner=${{ github.repository_owner }}
          version=$(grep -E "^\s*version\s*=" nextflow.config | head -1 | sed -E "s/.*'(.*)'.*/\1/")
          nextflow run . -profile test,docker --outdir results_test \
            --container_python ghcr.io/${owner}/tileparity-python:${version} \
            --container_uni2h ghcr.io/${owner}/tileparity-uni2h:${version} \
            --container_r ghcr.io/${owner}/tileparity-r:${version}
      - name: Show exports
        if: steps.images.outputs.available == 'true'
        run: find results_test/export -type f | sort

  test-conda:
    # Full run of the synthetic test with conda environments (slow; on demand only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.7'
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
      - name: Run the test profile with conda
        shell: bash -el {0}
        run: nextflow run . -profile test,conda --outdir results_test
